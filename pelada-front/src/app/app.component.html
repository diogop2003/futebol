<a class="skip-link" href="#main">Ir para o conteúdo</a>
<header class="site-header">
    <div class="header-inner"><a class="brand" routerLink="/" queryParamsHandling="preserve"><img class="brand-mark"
                src="assets/logo.png" alt="Logo Master" width="56" height="56"><span>Pelada</span></a>
        <nav aria-label="Navegação principal"><a routerLink="/" routerLinkActive="active"
                [routerLinkActiveOptions]="{exact:true}" queryParamsHandling="preserve">Saldo</a><a
                routerLink="/mensalistas" routerLinkActive="active" queryParamsHandling="preserve">Mensalistas</a><a
                routerLink="/diaristas" routerLinkActive="active" queryParamsHandling="preserve">Diaristas</a><a
                routerLink="/churrasco" routerLinkActive="active" queryParamsHandling="preserve">Churrasco</a>
            @if (auth.user()) { <a routerLink="/gerenciamento" routerLinkActive="active"
                queryParamsHandling="preserve">Gerenciamento</a><button class="nav-button" [disabled]="loggingOut"
                (click)="logout()">Sair</button> } @else { <a routerLink="/login" routerLinkActive="active">Entrar</a> }
        </nav>
    </div>
</header>
<main id="main" class="container">@if (error) { <p class="notice error" role="alert">{{ error }}</p> }<router-outlet />
</main>
<footer class="site-footer">Pelada · Transparência dentro e fora de campo</footer>
